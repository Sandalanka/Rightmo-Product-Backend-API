# Local development stack: PHP-FPM app, Nginx, MySQL and Redis (cache).
# The app container always uses MySQL and Redis, overriding the host/port settings in .env.
# DB name / user / password can be set in .env (DB_DATABASE, DB_USERNAME, DB_PASSWORD), otherwise the defaults below are used.

services:
  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8089}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-rightmo_product}"
      DB_USERNAME: "${DB_USERNAME:-rightmo}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8089}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3312}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-rightmo_product}"
      MYSQL_USER: "${DB_USERNAME:-rightmo}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6392}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
